services:
  # ---------------------------------------------------------------------------
  # FastAPI Analytics Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asklytix-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - asklytix-network

  # ---------------------------------------------------------------------------
  # React 19 Frontend (Served via Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asklytix-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - path: ./.env
        required: false
      - path: ./frontend/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - asklytix-network

networks:
  asklytix-network:
    driver: bridge

volumes:
  backend_storage:
    driver: local
